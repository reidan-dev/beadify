[project]
name = "beadify"
version = "0.1.0"
description = "Bead art pixelizer and tracker"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.9",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Install with: uv sync --extra rembg
rembg = [
    "rembg>=2.0.50",
    "scipy>=1.9",
    "onnxruntime>=1.17",
    "pymatting>=1.1",
]

[project.scripts]
beadify = "main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-strategy = "unsafe-best-match"

[[tool.uv.index]]
name = "pypi-fallback"
url = "https://pypi.org/simple"

[tool.uv.sources]
scipy     = { index = "pypi-fallback" }
onnxruntime = { index = "pypi-fallback" }
rembg     = { index = "pypi-fallback" }
pymatting = { index = "pypi-fallback" }

[tool.hatch.build.targets.wheel]
packages = ["."]

